<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Customer Care{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="wrap header-row">
            <a class="brand" href="{{ url_for('home') }}">Customer Care</a>
            <nav class="main-nav">
                <a href="{{ url_for('submit_complaint') }}">Report an issue</a>
                <a href="{{ url_for('track_complaint') }}">Track a complaint</a>
                <a href="{{ url_for('updates_feed') }}">Updates</a>
            </nav>
        </div>
    </header>

    <main>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="wrap flash-stack">
                    {% for category, msg in messages %}
                        <div class="flash flash-{{ category }}">{{ msg }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="wrap">
            <p>Customer Care &middot; we read every message</p>
        </div>
    </footer>
</body>
</html>
