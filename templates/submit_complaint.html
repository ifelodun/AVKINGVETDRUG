{% extends "base.html" %}
{% block title %}Report an issue{% endblock %}

{% block content %}
<section class="form-section wrap">
    <h1>Report an issue</h1>
    <p class="hero-sub">Give us the details and we'll get back to you. You'll receive a tracking code to follow the reply.</p>

    <form class="form-card" method="POST" enctype="multipart/form-data">
        <div class="field-row">
            <div class="field">
                <label for="name">Your name</label>
                <input type="text" id="name" name="name" value="{{ form.name if form else '' }}" required>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="{{ form.email if form else '' }}" required>
            </div>
        </div>

        <div class="field">
            <label for="phone">Phone <span class="hint">(optional)</span></label>
            <input type="tel" id="phone" name="phone" value="{{ form.phone if form else '' }}">
        </div>

        <div class="field">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" placeholder="e.g. Wrong item delivered" value="{{ form.subject if form else '' }}" required>
        </div>

        <div class="field">
            <label for="message">Tell us what happened</label>
            <textarea id="message" name="message" required>{{ form.message if form else '' }}</textarea>
        </div>

        <div class="field">
            <label for="images">Photos <span class="hint">(optional, up to 4)</span></label>
            <input type="file" id="images" name="images" accept="image/*" multiple>
        </div>

        <button class="btn btn-primary" type="submit">Send complaint</button>
    </form>
</section>
{% endblock %}
